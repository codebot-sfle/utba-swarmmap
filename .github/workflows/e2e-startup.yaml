name: E2E Startup Check

on:
  pull_request:
    branches: [ main ]

jobs:
  e2e-startup:
    name: E2E Startup Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Start Services
        run: |
          docker compose -f docker-compose.e2e.yaml up -d --build

      - name: Wait for Backend
        run: |
          echo "Waiting for backend to be ready..."
          timeout 60s bash -c 'until curl -s http://localhost:8080/ > /dev/null; do echo "Still waiting..."; sleep 2; done'
          echo "Backend is up!"

      - name: Check Backend Root (/)
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "Backend root returned $status_code"
          if [ "$status_code" -ne 200 ]; then
            echo "Error: Expected 200, got $status_code"
            exit 1
          fi

      - name: Check Backend Login (/login)
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login)
          echo "Backend login returned $status_code"
          # Check for 302 (Found) or 307 (Temporary Redirect)
          if [[ "$status_code" != "302" && "$status_code" != "307" ]]; then
            echo "Error: Expected 302 or 307, got $status_code"
            exit 1
          fi

      - name: Check Frontend (/static/css/style.css)
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/static/css/style.css)
          echo "Frontend static asset returned $status_code"
          if [ "$status_code" -ne 200 ]; then
            echo "Error: Expected 200, got $status_code"
            exit 1
          fi

      - name: Container Logs
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yaml logs

      - name: Stop Services
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yaml down
